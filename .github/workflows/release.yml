name: Release

on:
  push:
    tags:
      - "v[0-9]*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match package.json, e.g. v0.1.0)"
        required: true
        type: string

      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version and prepare release metadata
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if (
            $env:REQUESTED_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' -or
            $env:REQUESTED_TAG -cne "v$version"
          ) {
            throw "Tag '$env:REQUESTED_TAG' must match package.json version 'v$version' exactly."
          }

          # Use the exact commit checked out and tested by this job.
          $releaseSha = (git rev-parse HEAD).Trim()

          if (-not $releaseSha) {
            throw "Failed to resolve release commit SHA."
          }

          # Explicit prerelease input or SemVer prerelease suffix.
          $isPrerelease = "false"

          if (
            $env:REQUESTED_PRERELEASE -eq "true" -or
            $env:REQUESTED_TAG -match '-'
          ) {
            $isPrerelease = "true"
          }

          "release_tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
          "release_sha=$releaseSha" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

          Write-Host "Release tag: $env:REQUESTED_TAG"
          Write-Host "Release SHA: $releaseSha"
          Write-Host "Prerelease: $isPrerelease"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify bundled vendor files
        run: pnpm vendor:verify

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Build installer
        run: pnpm package --publish never

      - name: Prepare release files and checksums
        shell: pwsh
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md release/
          Copy-Item vendor/usbip-win2/source-0.9.8.0.zip release/
          Copy-Item vendor/usbip-win2/LICENSE.txt release/usbip-win2-LICENSE.txt

          $files = Get-ChildItem release -File |
            Where-Object {
              $_.Extension -in '.exe', '.zip', '.md', '.txt', '.blockmap'
            }

          if (-not $files) {
            throw "No release files were found."
          }

          $lines = $files | ForEach-Object {
            "{0}  {1}" -f (
              Get-FileHash $_.FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant(), $_.Name
          }

          $lines |
            Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/*.zip
            release/*.md
            release/*.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-test-results
          path: test-results
  publish:
    needs: build
    runs-on: ubuntu-latest
  
    permissions:
      contents: write
  
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts
  
      - name: Create tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
  
          : "${RELEASE_TAG:?RELEASE_TAG is empty}"
          : "${RELEASE_SHA:?RELEASE_SHA is empty}"
          : "${PRERELEASE:?PRERELEASE is empty}"
  
          echo "Release tag: $RELEASE_TAG"
          echo "Release SHA: $RELEASE_SHA"
          echo "Prerelease: $PRERELEASE"
  
          # Never overwrite an existing GitHub Release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite published artifacts." >&2
            exit 1
          fi
  
          # Check whether the tag exists.
          # Important: use the command exit status instead of treating a 404
          # response body as tag metadata.
          if ref_info=$(
            gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv' \
              2>/dev/null
          ); then
            IFS=$'\t' read -r object_type object_sha <<< "$ref_info"
  
            echo "Tag $RELEASE_TAG already exists."
            echo "Tag object type: $object_type"
            echo "Tag object SHA:  $object_sha"
  
            # Peel annotated tags until the underlying commit is reached.
            while [[ "$object_type" == "tag" ]]; do
              tag_info=$(
                gh api "repos/$GH_REPO/git/tags/$object_sha" \
                  --jq '[.object.type, .object.sha] | @tsv'
              )
  
              IFS=$'\t' read -r object_type object_sha <<< "$tag_info"
  
              echo "Resolved tag object type: $object_type"
              echo "Resolved tag object SHA:  $object_sha"
            done
  
            if [[ "$object_type" != "commit" ]]; then
              echo "Tag $RELEASE_TAG does not ultimately reference a commit." >&2
              echo "Resolved object type: $object_type" >&2
              exit 1
            fi
  
            if [[ "$object_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to another commit." >&2
              echo "Expected: $RELEASE_SHA" >&2
              echo "Actual:   $object_sha" >&2
              exit 1
            fi
  
            echo "Tag $RELEASE_TAG points to the expected commit."
  
          else
            echo "Tag $RELEASE_TAG does not exist."
            echo "Creating tag $RELEASE_TAG at $RELEASE_SHA"
  
            gh api \
              --method POST \
              "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$RELEASE_SHA" \
              >/dev/null
  
            echo "Created tag $RELEASE_TAG."
          fi
  
          flags=()
  
          if [[ "$PRERELEASE" == "true" || "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
  
          echo "Creating GitHub Release $RELEASE_TAG"
  
          gh release create "$RELEASE_TAG" \
            artifacts/* \
            --verify-tag \
            --title "RemoteUSB $RELEASE_TAG" \
            --generate-notes \
            "${flags[@]}"
  
          echo "Published RemoteUSB $RELEASE_TAG."
